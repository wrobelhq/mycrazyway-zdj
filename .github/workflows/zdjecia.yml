name: Biale tlo zdjec
on:
  push:
    paths: ['lista.txt', 'process.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy scipy
      - run: python process.py
      - run: |
          git config user.name "zdjecia-bot"
          git config user.email "zdjecia-bot@users.noreply.github.com"
          git add engwe
          git commit -m "Zdjecia ENGWE z bialym tlem" || echo "brak zmian"
          git push
